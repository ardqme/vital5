<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vital 5</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834;
  --z1: #0ca30c; --z2: #fab219; --z3: #ec835a; --z4: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 56px; }
h1 { font-size: 22px; margin: 0; font-weight: 650; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2);
  margin: 36px 0 12px; font-weight: 600; }
h3 { font-size: 15px; margin: 0; font-weight: 650; }
.sub { color: var(--ink2); font-size: 13px; }
.muted { color: var(--muted); font-size: 12.5px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.big { font-size: 52px; font-weight: 650; line-height: 1; letter-spacing: -.02em; }
.big small { font-size: 18px; font-weight: 500; color: var(--ink2); letter-spacing: 0; }
.val { font-size: 32px; font-weight: 650; line-height: 1.1; margin-top: 10px; }
.val small { font-size: 13px; font-weight: 500; color: var(--ink2); }
.head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
  border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px 2px 7px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.z1 { background: var(--z1); } .z2 { background: var(--z2); } .z3 { background: var(--z3); } .z4 { background: var(--z4); }
.z0 { background: transparent; border: 1.5px solid var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink2); font-weight: 600; font-size: 12.5px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; padding-left: 10px; }
tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 650; border-top: 1px solid var(--axis); }
.scroll { overflow-x: auto; }
.chart { position: relative; margin-top: 12px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
.stack-title { font-size: 12.5px; color: var(--ink2); margin-top: 10px; }
.zv, .zv > span { display: inline-flex; align-items: center; gap: 4px; }
.zv { gap: 3px; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { width: 14px; height: 2px; border-radius: 1px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  box-shadow: 0 4px 14px rgba(0,0,0,.14); border-radius: 6px; padding: 6px 9px; font-size: 12.5px;
  white-space: nowrap; z-index: 2; display: none; }
.tip b { display: block; font-weight: 600; color: var(--ink2); font-size: 11.5px; }
.empty { color: var(--muted); font-size: 13px; padding: 18px 0 6px; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--ink2); font-size: 12.5px; }
details table { margin-top: 6px; }
.tyg td, .tyg th { text-align: center; padding: 8px 6px; border: 1px solid var(--grid); }
.tyg th:first-child { text-align: left; }
.tyg td { position: relative; color: var(--ink2); }
.tyg td.here { outline: 2px solid var(--ink); outline-offset: -2px; color: var(--ink); font-weight: 650; }
.tyg td .dot { display: inline-block; margin-right: 5px; }
@media (min-width: 560px) { .grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 900px) { .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.panel { font-size: 16px; font-weight: 650; margin: 26px 0 10px; }
.panel:first-of-type { margin-top: 0; }
.lab { padding: 12px 14px; display: flex; flex-direction: column; }
.lab .head { align-items: baseline; }
.lab .chart { margin-top: auto; padding-top: 6px; }
.lab .now { font-size: 15px; font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lab .now small { font-size: 12px; font-weight: 500; color: var(--ink2); }
.flag { color: var(--z4); font-weight: 650; }
.numbers { margin-top: 14px; }
.numbers td.n, .numbers th.n { white-space: nowrap; }
@media (max-width: 520px) { .hide-s { display: none; } th, td { padding-right: 4px; } td.n, th.n { padding-left: 4px; } .chip { padding: 1px 7px 1px 5px; } }
.switch { display: inline-flex; border: 1px solid var(--axis); border-radius: 7px; overflow: hidden; margin-top: 10px; }
.switch button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 4px 12px; border: 0; background: transparent; color: var(--ink2); cursor: pointer; }
.switch button + button { border-left: 1px solid var(--axis); }
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.rules h3 { margin-bottom: 6px; }
.rules th { white-space: nowrap; }
.rules p { margin: 8px 0 0; }
footer { margin-top: 32px; color: var(--muted); font-size: 12.5px; }
/* Printing (File > Print > Save as PDF). The script sets .printing just before
   the page is laid out for paper, so the charts are redrawn at paper width. */
@page { margin: 12mm; }
.printing main { width: 700px; max-width: none; padding: 0; }
.printing .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.printing .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media print {
  :root { color-scheme: light;
    --page: #fff; --surface: #fff; --ink: #0b0b0b; --ink2: #52514e; --muted: #6b6963;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.18); --s1: #2a78d6; --s2: #eb6834; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 13px; }
  main { margin: 0 auto; padding: 0; }
  .card, .chart, tr { break-inside: avoid; }
  .numbers { break-inside: auto; }
  h2, h3, .panel, .stack-title { break-after: avoid; }
  .switch, .tip, summary { display: none; }
  .scroll { overflow: visible; }
  .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
</style>

    el("div", { class: "sub" }, "As of " + fmtDate(D.today, true) + (D.who ? " · " + D.who : ""))),
  hero(),
  el("h2", {}, "The five vitals"),
  el("div", { class: "grid two" }, D.card.vitals.map(vitalCard)),
  ...tygSection(),
  el("h2", {}, "Bodyweight"), el("div", { class: "card" }, chartBlock(D.charts.weight, 200)),
  ...labsSection(),
  ...rulesSection(),
  el("footer", {}, "Zones, points, and weights are from Barbell Medicine's Vital 5 Action Plan (barbellmedicine.com). This page tracks measurements; it is not medical advice."));
  // Draw once now that the charts are in the page.
  REDRAW.forEach(draw => draw());
}
render();
window.addEventListener("resize", () => REDRAW.forEach(draw => draw()));

// Paper has no hover and no clicks. Before printing: lay the page out at paper
// width, redraw the charts to fit, and open each "Show the numbers" table short
// enough to be worth the paper (daily bodyweight is left to its chart).
const PRINT_ROWS = 80;
let opened = [];
window.addEventListener("beforeprint", () => {
  document.body.classList.add("printing");
  opened = [...document.querySelectorAll("details:not([open])")].filter(d => d.querySelectorAll("tbody tr").length <= PRINT_ROWS);
  opened.forEach(d => { d.open = true; });
  REDRAW.forEach(draw => draw());
});
window.addEventListener("afterprint", () => {
  document.body.classList.remove("printing");
  opened.forEach(d => { d.open = false; });
  opened = [];
  REDRAW.forEach(draw => draw());
});
</script>
</body>
</html>
